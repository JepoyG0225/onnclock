plugins { id 'com.android.application' }
def signingFile = System.getenv('ONCLOCK_KIOSK_SIGNING_FILE')
if (!signingFile || !file(signingFile).exists()) throw new GradleException('ONCLOCK_KIOSK_SIGNING_FILE must point to the private release signing properties file.')
def keys = new Properties()
file(signingFile).withInputStream { keys.load(it) }
android {
 namespace 'com.onclock.officekiosk'
 compileSdk 36
 defaultConfig { applicationId 'com.onclock.officekiosk'; minSdk 24; targetSdk 36; versionCode 2; versionName '1.0.1' }
 signingConfigs { release { storeFile file(keys['storeFile']); storePassword keys['storePassword']; keyAlias keys['keyAlias']; keyPassword keys['keyPassword'] } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
