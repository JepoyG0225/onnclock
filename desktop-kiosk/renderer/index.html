<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OnClock Face Kiosk</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #021e47;
    --navy-2: #032b63;
    --orange: #ff5900;
    --teal: #1b6a6e;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(255,89,0,.18), transparent 60%),
      linear-gradient(165deg, #0b1626 0%, #021e47 55%, #16324f 100%);
    color: #fff;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .screen { height: 100vh; display: none; }
  .screen.active { display: flex; }

  /* ── Sign in ───────────────────────────────────────────────────────── */
  #signin { align-items: center; justify-content: center; padding: 24px; }
  .card {
    width: 100%; max-width: 420px; background: #fff; color: #0f172a;
    border-radius: 28px; padding: 32px; box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .card h1 { font-size: 22px; font-weight: 900; color: var(--navy-2); }
  .card p.sub { font-size: 13px; color: #64748b; margin-top: 4px; }
  label {
    display: block; font-size: 11px; font-weight: 900; text-transform: uppercase;
    letter-spacing: .06em; color: #64748b; margin: 18px 0 6px;
  }
  input {
    width: 100%; padding: 13px 14px; font-size: 15px; font-weight: 500;
    border: 2px solid #e2e8f0; border-radius: 14px; outline: none; background: #f8fafc;
  }
  input:focus { border-color: var(--navy-2); background: #fff; }
  button.primary {
    width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 16px;
    font-size: 15px; font-weight: 900; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--navy), var(--navy-2));
  }
  button.primary:disabled { opacity: .6; cursor: default; }
  .error {
    margin-top: 14px; padding: 11px 13px; border-radius: 12px;
    background: #fef2f2; color: #b91c1c; font-size: 13px; font-weight: 600;
  }
  .muted-link {
    display: block; width: 100%; margin-top: 12px; background: none; border: 0;
    color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  /* ── Scanner ───────────────────────────────────────────────────────── */
  #scanner { flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; }
  .brandbar {
    position: fixed; top: 0; left: 0; right: 0; padding: 14px 22px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 700; color: rgba(255,255,255,.45);
  }
  .stage { position: relative; width: 420px; height: 420px; border-radius: 50%; overflow: hidden;
           background: #000; box-shadow: 0 0 0 3px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.5); }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage video { object-fit: cover; transform: scaleX(-1); }
  .stage canvas { transform: scaleX(-1); }
  .status { text-align: center; }
  .status h2 { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
  .status p { font-size: 14px; color: rgba(255,255,255,.55); margin-top: 6px; font-weight: 600; }
  .clock { font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .clock small { display: block; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.45); margin-top: 4px; }

  /* ── Result overlay ────────────────────────────────────────────────── */
  #result {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; backdrop-filter: blur(10px); z-index: 40;
  }
  #result.show { display: flex; }
  #result .avatar {
    width: 118px; height: 118px; border-radius: 50%; object-fit: cover;
    border: 4px solid rgba(255,255,255,.8);
  }
  #result .initials {
    width: 118px; height: 118px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 40px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, var(--navy-2), var(--teal));
  }
  #result h2 { font-size: 34px; font-weight: 900; }
  #result .verdict { font-size: 17px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  #result .detail { font-size: 14px; color: rgba(255,255,255,.65); font-weight: 600; }
</style>
</head>
<body>

<!-- ── Sign in ─────────────────────────────────────────────────────────── -->
<div id="signin" class="screen active">
  <div class="card">
    <h1>Set up this kiosk</h1>
    <p class="sub">Sign in once with a company admin account. Employees then clock in by face — they do not sign in here.</p>

    <label for="email">Admin email</label>
    <input id="email" type="email" autocomplete="off" placeholder="admin@company.com" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="off" placeholder="••••••••" />

    <label for="kioskName">Kiosk name <span style="text-transform:none;color:#cbd5e1">(optional)</span></label>
    <input id="kioskName" type="text" placeholder="Main lobby" />

    <button id="signinBtn" class="primary">Sign in &amp; start kiosk</button>
    <div id="signinError" class="error" style="display:none"></div>
    <button id="serverBtn" class="muted-link">Change server URL</button>
  </div>
</div>

<!-- ── Scanner ─────────────────────────────────────────────────────────── -->
<div id="scanner" class="screen">
  <div class="brandbar">
    <span id="companyLabel"></span>
    <span>
      <span id="kioskLabel"></span>
      <button id="signOutBtn" class="muted-link" style="display:inline;width:auto;margin:0 0 0 16px">Sign out</button>
    </span>
  </div>

  <div class="clock" id="clock">--:--:--<small id="today"></small></div>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="status">
    <h2 id="statusTitle">Starting camera…</h2>
    <p id="statusHint">Look at the screen to clock in or out</p>
  </div>
</div>

<div id="result">
  <div id="resultAvatar"></div>
  <h2 id="resultName"></h2>
  <div class="verdict" id="resultVerdict"></div>
  <div class="detail" id="resultDetail"></div>
</div>

<script src="../vendor/face-api.min.js"></script>
<script src="./kiosk.js"></script>
</body>
</html>
